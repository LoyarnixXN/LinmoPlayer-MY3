name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Plugin service e2e
        run: node tools/e2e-plugin-service.mjs

      - name: Format check
        run: npm run format:check

      - name: Build renderer
        run: npm run build:renderer --workspace @linmo/desktop
